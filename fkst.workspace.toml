[workspace]
# fkst-website is a website-source-primary host repo: its OWN Lua packages are
# committed under .fkst/local-packages/<pkg> (the repo root stays website
# source). Cross-repo conformance package roots are supplied via
# .fkst/conformance/package-roots, resolved at conformance time from the pinned
# fkst-packages checkout. The workspace catalog must not depend on generated
# .fkst/run/ scratch; that broke supervise startup when the scratch checkout had
# not been hydrated.
units = [".fkst/local-packages/*", ".fkst/std"]
packages = [".fkst/local-packages/*"]
libraries = [".fkst/std"]

[registries]
workspace = "workspace"

# Cross-repo library reference (库 C consuming 库 B's published `contract` core,
# pinned by exact git sha; the resolved sha + content hashes live in fkst.lock).
# Root-owned source binding: consuming units just name "contract" in lib_deps.
[[external_sources]]
id = "fkst-packages-platform"
git = "https://github.com/ChronoAIProject/fkst-packages.git"
rev = "fa0c8fa6b2f94d3f802743f0fcc0eaca88bea87e"
libraries = ["contract", "workflow", "testkit"]
