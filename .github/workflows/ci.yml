name: ci

on:
  push:
    branches: [main, dev, integration]
  pull_request:
    branches: [main, dev, integration]
  workflow_dispatch:
    inputs:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fkst-website
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build Astro site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Probe built site (pre-merge deploy gate)
        run: bash scripts/probe_built_site.sh site/_site

