[workspace]
# fkst-website is a website-source-primary host repo: its OWN Lua packages are
# committed under .fkst/local-packages/<pkg> (the repo root stays website
# source). Cross-repo package roots stay in .fkst/compose/package-roots via
# fkst-packages:<path>, so this manifest remains valid before .fkst/run/ is
# hydrated by scripts/run.sh.
units = [".fkst/local-packages/*", ".fkst/local-libraries/text"]
packages = [".fkst/local-packages/*"]
libraries = [".fkst/local-libraries/text"]

[registries]
workspace = "workspace"

# Cross-repo library reference (库 C consuming 库 B's published `contract` core,
# pinned by exact git sha; the resolved sha + content hashes live in fkst.lock).
# Root-owned source binding: consuming units just name "contract" in lib_deps.
[[external_sources]]
id = "fkst-packages-platform"
git = "https://github.com/ChronoAIProject/fkst-packages.git"
rev = "a20aeffec442507bfb527a8df4e8b36597c0c75c"
libraries = ["contract"]
