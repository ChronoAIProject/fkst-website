[workspace]
# fkst-website is a website-source-primary host repo: its OWN Lua packages are committed
# under .fkst/local-packages/<pkg> (the repo root stays website source). The platform trio
# (github-devloop/github-proxy/consensus) is EXTERNAL infra supplied via --package-root from
# a pinned fkst-packages clone — the engine catalogs those explicit external roots from their
# own source manifest, so this manifest declares only this repo's own units.
units = [".fkst/local-packages/*", ".fkst/std"]
packages = [".fkst/local-packages/*"]
libraries = [".fkst/std"]

[registries]
workspace = "workspace"

# Cross-repo library reference (库 C consuming 库 B's published `contract` core,
# pinned by exact git sha; the resolved sha + content hashes live in fkst.lock).
# Root-owned source binding: consuming units just name "contract" in lib_deps.
[[external_sources]]
id = "fkst-packages-platform"
git = "https://github.com/ChronoAIProject/fkst-packages.git"
rev = "8a86cad49542e794aaf3bfff91c36b04ba8a361c"
libraries = ["contract"]
